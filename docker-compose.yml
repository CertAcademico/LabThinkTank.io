services:

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - cti_data:/data
    environment:
      - DB_PATH=/data/cti.db
      # Ollama — if running on host machine use host.docker.internal
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL_FAST=${GEMINI_MODEL_FAST:-gemini-2.0-flash}
      - GEMINI_MODEL_SMART=${GEMINI_MODEL_SMART:-gemini-2.5-flash}
      # MISP — leave blank to use public botvrij.eu feed (no auth needed)
      - MISP_URL=${MISP_URL:-}
      - MISP_KEY=${MISP_KEY:-}
      # Con Cloudflare Tunnel no se necesita el dominio del tunnel aquí —
      # nginx proxea /api/* internamente, el browser nunca habla directo al 8000.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        # The browser will call this URL — must be reachable from the student's browser
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      - backend

  # ── Cloudflare Named Tunnel ACTIVO (dominio propio, URL estable) ───────────
  # Usa CLOUDFLARE_TUNNEL_TOKEN del .env (Zero Trust → Networks → Tunnels → token).
  # El ingress lo define el dashboard: Public Hostname → servicio http://frontend:80.
  # nginx (frontend:80) sirve el SPA y proxea /api/* al backend (mismo origen).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

  # ── Quick Tunnel (sin cuenta, URL temporal *.trycloudflare.com) — DESACTIVADO
  # Para usarlo: comenta cloudflared de arriba, descomenta esto y arranca con
  #   TUNNEL_SVC=cloudflared-quick ./start.sh   (la URL cambia en cada reinicio)
  # cloudflared-quick:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate --url http://frontend:80
  #   depends_on:
  #     - frontend

volumes:
  cti_data:
